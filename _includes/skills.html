{% assign skills = site.data.data.skills %}
{% if skills %}
<section class="section skills-section" id="skills">
  <div class="container">
    <h2 class="section-title" data-aos="fade-up">{{ skills.title }}</h2>
    <div class="skills-categories">
      {% for category in skills.categories %}
      <div class="skill-category" data-aos="fade-up" data-aos-delay="{{ forloop.index | times: 150 }}">
        <h3 class="skill-category-title">{{ category.name }}</h3>
        <div class="skill-tags">
          {% for item in category.items %}
          <span class="skill-tag" data-skill="{{ item }}" style="--i: {{ forloop.index }}">{{ item }}</span>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
