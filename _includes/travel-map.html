<section class="section travel-section" id="travel">
  <div class="container">
    <h2 class="section-title" data-label="05 // coordinates" data-aos="fade-up">Places I've Been</h2>
    <div class="travel-content" data-aos="fade-up" data-aos-delay="100">
      <div class="travel-map-wrapper">
        <iframe
          src="https://www.google.com/maps/d/u/0/embed?mid=17LNQyXGDYA2TEIECT1Jg5Vr1IyIMQ4cj"
          width="100%"
          height="480"
          frameborder="0"
          style="border:0; border-radius: 12px;"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
      <p class="travel-hint">
        <i class="fas fa-map-marker-alt"></i> Zoom in and click the pins to explore!
      </p>
    </div>
  </div>
</section>
