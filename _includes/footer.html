{% assign sidebar = site.data.data.sidebar %}
<footer class="footer" id="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-links">
        {% if sidebar.email %}
        <a href="mailto:{{ sidebar.email }}" aria-label="Email"><i class="fas fa-envelope"></i></a>
        {% endif %}
        {% if sidebar.linkedin_url %}
        <a href="{{ sidebar.linkedin_url }}" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        {% endif %}
        {% if sidebar.github %}
        <a href="https://github.com/{{ sidebar.github }}" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a>
        {% endif %}
      </div>
      <div class="footer-quote">
        {{ site.data.data.footer }}
      </div>
      <div class="footer-copyright">
        &copy; {{ 'now' | date: '%Y' }} {{ sidebar.name }}. Built with Jekyll.
      </div>
    </div>
  </div>
</footer>
