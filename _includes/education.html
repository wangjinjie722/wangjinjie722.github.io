{% assign education = site.data.data.education %}
{% if education %}
<section class="section education-section" id="education">
  <div class="container">
    <h2 class="section-title" data-label="03 // training" data-aos="fade-up">Education</h2>
    <div class="education-grid">
      {% for graduation in education %}
      <div class="education-card" data-aos="fade-up" data-aos-delay="{{ forloop.index | times: 150 }}">
        <div class="education-logo">
          <img src="{{ graduation.logo }}" alt="{{ graduation.university }}" />
        </div>
        <div class="education-info">
          <h3 class="education-degree">{{ graduation.degree }}</h3>
          <div class="education-university">{{ graduation.university }}</div>
          <div class="education-time">{{ graduation.time }}</div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
