{% assign career-profile = site.data.data.career-profile %}
{% if career-profile %}
<section class="section about-section" id="about">
  <div class="container">
    <h2 class="section-title" data-label="01 // profile" data-aos="fade-up">{{ career-profile.title }}</h2>
    <div class="about-content" data-aos="fade-up" data-aos-delay="100">
      <div class="about-text">
        {{ career-profile.summary | markdownify }}
      </div>
      {% if career-profile.resume %}
      <a href="{{ career-profile.resume }}" class="btn-resume" target="_blank" rel="noopener">
        <i class="fas fa-download"></i> Download Resume
      </a>
      {% endif %}
    </div>
  </div>
</section>
{% endif %}
